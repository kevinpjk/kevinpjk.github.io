- slug: cocoa
  title: "Cocoa: Co-Planning and Co-Execution with AI Agents"
  short_name: "Cocoa"
  short_desc: "Co-planning & co-executing tasks with AI agents"
  emoji: "\U0001F36B"
  authors:
    - { name: "K. J. Kevin Feng", url: "https://kjfeng.me/#/" }
    - { name: "Kevin Pu", url: null, highlight: true }
    - { name: "Matt Latzke", url: null }
    - { name: "Tal August", url: null }
    - { name: "Pao Siangliulue", url: null }
    - { name: "Jonathan Bragg", url: null }
    - { name: "Daniel S. Weld", url: null }
    - { name: "Amy X. Zhang", url: null }
    - { name: "Joseph Chee Chang", url: null }
  venue: CHI
  year: 2026
  category: what-it-shows
  award: "Best Paper"
  links:
    pdf: /assets/pdf/cocoa_chi_2026.pdf
    video: null
    arxiv: https://arxiv.org/abs/2412.10999
    website: null
    doi: https://doi.org/10.1145/3772318.3791673
    code: null
  summary: "Cocoa is a system for collaborating with AI agents on research tasks, taking design inspiration from computational notebooks. Work is represented as a collaborative plan whose individual steps can be assigned to either the user or the agent, and planning and execution are interleaved so a plan can be adjusted after it has partly run. The design grew out of a formative study with nine researchers using AI in their work, and was evaluated in a lab study and a week-long field deployment."
  selected: true
  selected_order: 4
  teaser: cocoa.png
  teaser_type: image
  ring_concept: "co-planning with agents"
  ring_keywords: ["agents", "planning", "co-execution", "collaboration"]

- slug: promemassist
  title: "ProMemAssist: Exploring Timely Proactive Assistance Through Working Memory Modeling in Multi-Modal Wearable Devices"
  short_name: "ProMemAssist"
  short_desc: "Proactive AI assistance via working memory modeling"
  emoji: "\U0001F9E0"
  authors:
    - { name: "Kevin Pu", url: null, highlight: true }
    - { name: "Ting Zhang", url: null }
    - { name: "Naveen Sendhilnathan", url: null }
    - { name: "Sebastian Freitag", url: null }
    - { name: "Raj Sodhi", url: null }
    - { name: "Tanya R. Jonker", url: null }
  venue: UIST
  year: 2025
  category: when-ai-acts
  award: null
  links:
    pdf: /assets/pdf/promemassist_uist_2025.pdf
    video: https://youtu.be/Z2pjXKUZtMg
    arxiv: https://arxiv.org/abs/2507.21378
    website: null
    doi: https://doi.org/10.1145/3746059.3747770
    code: null
  summary: "ProMemAssist is a smart glasses system that models a wearer's working memory in real time from multi-modal sensor signals. Grounded in cognitive theories of working memory, it represents perceived information as memory items and episodes with encoding mechanisms such as displacement and interference. That model feeds a timing predictor which weighs the value of offering assistance against the cost of interrupting. It was evaluated with twelve participants against an LLM baseline."
  selected: true
  selected_order: 2
  teaser: promemassist.png
  teaser_type: image
  ring_concept: "working memory model"
  ring_keywords: ["memory", "proactivity", "wearable", "cognitive load", "interruption"]

- slug: storyensemble
  title: "StoryEnsemble: Enabling Dynamic Exploration & Iteration in the Design Process with AI and Forward-Backward Propagation"
  authors:
    - { name: "Sangho Suh", url: null }
    - { name: "Michael Lai", url: null }
    - { name: "Kevin Pu", url: null, highlight: true }
    - { name: "Steven P. Dow", url: null }
    - { name: "Tovi Grossman", url: "https://www.tovigrossman.com/" }
  venue: UIST
  year: 2025
  category: human-ai-collaboration
  award: null
  links:
    pdf: /assets/pdf/storyensemble_uist_2025.pdf
    video: https://youtu.be/19lfRs-cizU
    arxiv: null
    website: null
    doi: https://doi.org/10.1145/3746059.3747772
    code: null
  summary: "StoryEnsemble integrates AI into a node-link interface for design work, using forward and backward propagation to move between stages such as persona creation, problem framing, ideation, and prototyping. A change in one stage can propagate to the others in either direction, so designers can revisit earlier assumptions without starting over. It was developed from a formative study with fifteen UX practitioners, students, and instructors, and evaluated with ten participants."
  selected: false
  teaser: storyensemble.png
  teaser_type: image
  ring_concept: "design iteration with AI"
  ring_keywords: ["design thinking", "iteration", "propagation", "AI co-design"]

- slug: codellaborator
  title: "Assistance or Disruption? Exploring and Evaluating the Design and Trade-offs of Proactive AI Programming Support"
  short_name: "Codellaborator"
  short_desc: "Exploring trade-offs of proactive AI programming agents"
  emoji: "\U0001F4BB"
  authors:
    - { name: "Kevin Pu", url: null, highlight: true }
    - { name: "Daniel Lazaro", url: null }
    - { name: "Ian Arawjo", url: null }
    - { name: "Haijun Xia", url: null }
    - { name: "Ziang Xiao", url: null }
    - { name: "Tovi Grossman", url: "https://www.tovigrossman.com/" }
    - { name: "Yan Chen", url: "https://chensivan.github.io/" }
  venue: CHI
  year: 2025
  category: when-ai-acts
  award: null
  links:
    pdf: /assets/pdf/codellaborator_chi_2025.pdf
    video: https://youtu.be/mI-jd-IjfE4
    arxiv: https://arxiv.org/abs/2502.18658
    website: null
    doi: https://doi.org/10.1145/3706598.3713357
    code: null
  summary: "Codellaborator is a design probe for proactive AI programming assistance: an LLM agent that initiates help based on editor activity and task context rather than waiting to be prompted. The work compares three interface variants of increasing salience — prompt-only, a proactive agent, and a proactive agent with presence indicators and interaction context — to examine the trade-offs proactive support creates around user control, ownership, and code understanding. It was evaluated in a within-subjects study with eighteen participants."
  selected: true
  selected_order: 1
  teaser: cody.png
  teaser_type: image
  ring_concept: "proactive code agents"
  ring_keywords: ["proactivity", "programming", "agent", "disruption", "code"]

