# =============================================================================
# site.yaml — site-wide switches
#
# Each block here is a single edit that turns one piece of the site on or off.
# =============================================================================

# Job-market banner on the homepage.
# To remove the banner entirely, set `enabled: false`. Nothing else to change.
job_market_banner:
  enabled: true
  heading: "On the job market"
  body: >-
    I am applying for tenure-track faculty and industry research positions for
    2027. I expect to complete my PhD in June 2027.
  links:
    - { label: "CV", href: "/assets/pdf/Kevin_Jiankai_Pu_Research_CV.pdf" }
    - { label: "Email", href: "mailto:jpu@dgp.toronto.edu" }
  # Lets a visitor dismiss the banner for their own browser only.
  dismissible: true

# Manuscripts under submission (src/data/manuscripts.yaml).
#
# Kevin enabled these deliberately. Setting `enabled: false` hides them again
# everywhere in one edit.
manuscripts_under_review:
  enabled: true
  heading: "Manuscripts Under Submission"
  # Fixed label. Never "to appear", "accepted", or "forthcoming".
  label: "Manuscript under submission, 2026"
